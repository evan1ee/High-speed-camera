name: Build and Package Windows MSI Installer

on:
  push:
    branches:
      - main
      - master
      - capture-gel-injection
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    name: Build MSI Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8 (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtsvg'
          cache: true

      - name: Install WiX Toolset & Extensions
        shell: pwsh
        run: |
          Write-Host "Installing WiX v7 dotnet global tool..."
          dotnet tool install --global wix --version 7.0.1
          $dotnetTools = "$env:USERPROFILE\.dotnet\tools"
          if (Test-Path $dotnetTools) {
            Write-Host "Adding $dotnetTools to GITHUB_PATH"
            $dotnetTools | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$dotnetTools;$env:PATH"
          }
          Write-Host "Accepting WiX v7 EULA..."
          wix eula accept wix7
          Write-Host "Adding WiX UI and Util extensions..."
          wix extension add -g WixToolset.UI.wixext --version 7.0.1
          wix extension add -g WixToolset.Util.wixext --version 7.0.1
          wix extension list -g

      - name: Determine Application Version
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}") {
            $ver = "${{ inputs.version }}"
          } elseif ($env:GITHUB_REF -match '^refs/tags/v?(\d+(\.\d+){1,3})') {
            $ver = $Matches[1]
          }
          Write-Host "Resolved Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Application, Run Tests & Package MSI
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\build_msi.bat" %VERSION%

      - name: Verify MSI Structure & Custom Actions
        shell: pwsh
        run: |
          ./installer/inspect_msi.ps1 -MsiPath "installer/dist/HighSpeedCamera_v${env:VERSION}_x64.msi" -ExpectedVersion $env:VERSION

      - name: Upload MSI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighSpeedCamera_v${{ env.VERSION }}_x64_MSI
          path: installer/dist/*.msi
          if-no-files-found: error

      - name: Create GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/*.msi
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
