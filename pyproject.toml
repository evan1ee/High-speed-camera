[project]
name = "hsc"
version = "1.0.0"
description = "High-speed camera spray-angle toolkit for a needle-free injector test rig"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.10",
    "scipy>=1.16",
    "scikit-learn>=1.9",
    "pillow>=11.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
]

[dependency-groups]
# PyInstaller was dropped with the Tk app: its spec's entry point (run_gui.py)
# is gone, and the frozen build returns when there is a web build to bundle.
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

# The hsc/ package is run in place from the repo root (via `uv run`), never
# built or installed into the environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # fastapi.testclient warns on import that httpx will be replaced by
    # httpx2. httpx is this project's authorised dependency, so the warning is
    # noise -- and noise is what hides a warning that matters. Silenced here
    # rather than by swapping the dependency.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.coverage.run]
source = ["hsc/hardware", "hsc/rig", "hsc/api"]
omit = ["hsc/hardware/imv.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
